<svg width="100%" height="100%" viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Card Inner Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Cyan Neon Glow Filter -->
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#4F94EF" />
    </linearGradient>

    <linearGradient id="cyan-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI Mono', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title-text { font-size: 14px; font-weight: 700; fill: #8B949E; letter-spacing: 2px; }
    .header-main { font-size: 22px; font-weight: 800; fill: #00D4FF; letter-spacing: 0.5px; }
    .sub-text { font-size: 13.5px; fill: #C9D1D9; line-height: 1.6; }
    .label-text { font-size: 12px; font-weight: 700; fill: #00D4FF; letter-spacing: 1px; }
    .val-text { font-size: 13px; fill: #E6EDF3; font-weight: 500; }
    .stat-num { font-size: 26px; font-weight: 900; fill: #00D4FF; }
    .stat-label { font-size: 11px; font-weight: 600; fill: #8B949E; text-transform: uppercase; letter-spacing: 1px; }
    .card-title { font-size: 14px; font-weight: 700; fill: #00D4FF; }
    .quote-text { font-size: 12.5px; fill: #C9D1D9; font-style: italic; line-height: 1.5; }
    .tag-bg { fill: #1F2937; rx: 4px; }
    .tag-text { font-size: 11px; fill: #00D4FF; font-weight: 600; }
  </style>

  <!-- Outer HUD Frame -->
  <rect x="2" y="2" width="996" height="476" rx="12" fill="url(#bg-grad)" stroke="#30363D" stroke-width="1.5" />
  <!-- Glowing Top Border Accent -->
  <rect x="2" y="2" width="996" height="3" fill="url(#cyan-blue)" />

  <!-- Window Control Buttons & Title Bar -->
  <circle cx="25" cy="24" r="6" fill="#FF5F56" />
  <circle cx="45" cy="24" r="6" fill="#FFBD2E" />
  <circle cx="65" cy="24" r="6" fill="#27C93F" />

  <text x="95" y="28" class="mono title-text">PRABHAV_BATRA.sys // ENGINEERING_HUD [v3.6.0]</text>

  <!-- Status Badge Right -->
  <rect x="790" y="12" width="185" height="24" rx="12" fill="#161B22" stroke="#30363D" />
  <circle cx="806" cy="24" r="4" fill="#00FFA3" filter="url(#neon-glow)" />
  <text x="818" y="28" class="mono" font-size="11" font-weight="700" fill="#00FFA3">STATUS: ONLINE 100%</text>

  <!-- Divider Line below header -->
  <line x1="2" y1="44" x2="998" y2="44" stroke="#30363D" stroke-width="1" />

  <!-- LEFT PANEL: MAIN PROFILE HUD (x: 20 to 590) -->
  <g transform="translate(20, 60)">
    <!-- Subheader Tag -->
    <text x="0" y="20" class="mono label-text">&gt; // ABOUT_ENGINEER</text>

    <!-- Bio Text -->
    <text x="0" y="46" class="sans sub-text">Architecting scalable backend engines, high-performance Flutter applications,</text>
    <text x="0" y="66" class="sans sub-text">and distributed microservices with clean design and zero fluff.</text>

    <!-- Key Directives List -->
    <g transform="translate(0, 95)">
      <!-- Directive 1 -->
      <rect x="0" y="0" width="560" height="34" rx="6" fill="#161B22" stroke="#21262D" />
      <text x="12" y="21" class="mono label-text" font-size="11">[BUILDING]</text>
      <text x="110" y="21" class="sans val-text">Next-Gen AI Engineering OS &amp; Payment Infrastructure</text>

      <!-- Directive 2 -->
      <rect x="0" y="42" width="560" height="34" rx="6" fill="#161B22" stroke="#21262D" />
      <text x="12" y="63" class="mono label-text" font-size="11">[STACK]</text>
      <text x="110" y="63" class="sans val-text">Java · Kotlin · Dart · Spring Boot · Flutter · Redis · Postgres</text>

      <!-- Directive 3 -->
      <rect x="0" y="84" width="560" height="34" rx="6" fill="#161B22" stroke="#21262D" />
      <text x="12" y="105" class="mono label-text" font-size="11">[TARGET]</text>
      <text x="110" y="105" class="sans val-text">Low-Latency Microservices &amp; Cross-Platform Products</text>

      <!-- Directive 4 -->
      <rect x="0" y="126" width="560" height="34" rx="6" fill="#161B22" stroke="#21262D" />
      <text x="12" y="147" class="mono label-text" font-size="11">[LOCATION]</text>
      <text x="110" y="147" class="sans val-text">India 🇮🇳  // Available for High-Impact Projects</text>
    </g>

    <!-- Stat Counter Grid at Bottom (4 Cards) -->
    <g transform="translate(0, 275)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="130" height="65" rx="8" fill="#161B22" stroke="#00D4FF" stroke-opacity="0.4" />
      <text x="65" y="34" text-anchor="middle" class="mono stat-num">3+</text>
      <text x="65" y="52" text-anchor="middle" class="mono stat-label">Years Dev</text>

      <!-- Stat 2 -->
      <rect x="143" y="0" width="130" height="65" rx="8" fill="#161B22" stroke="#00D4FF" stroke-opacity="0.4" />
      <text x="208" y="34" text-anchor="middle" class="mono stat-num">15+</text>
      <text x="208" y="52" text-anchor="middle" class="mono stat-label">Projects</text>

      <!-- Stat 3 -->
      <rect x="286" y="0" width="130" height="65" rx="8" fill="#161B22" stroke="#00D4FF" stroke-opacity="0.4" />
      <text x="351" y="34" text-anchor="middle" class="mono stat-num" fill="#00FFA3">99.9%</text>
      <text x="351" y="52" text-anchor="middle" class="mono stat-label">Uptime Goal</text>

      <!-- Stat 4 -->
      <rect x="429" y="0" width="131" height="65" rx="8" fill="#161B22" stroke="#00D4FF" stroke-opacity="0.4" />
      <text x="494" y="34" text-anchor="middle" class="mono stat-num" fill="#4F94EF">100%</text>
      <text x="494" y="52" text-anchor="middle" class="mono stat-label">Prod Focus</text>
    </g>
  </g>

  <!-- VERTICAL DIVIDER LINE -->
  <line x1="605" y1="60" x2="605" y2="445" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- RIGHT PANEL: PHILOSOPHY & MISSION CARDS (x: 625 to 975) -->
  <g transform="translate(625, 60)">

    <!-- Card 1: Philosophy -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="350" height="120" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <!-- Left Glowing Border -->
      <rect x="0" y="0" width="4" height="120" rx="2" fill="#00D4FF" filter="url(#neon-glow)" />

      <text x="18" y="28" class="mono card-title">🧠 // ENGINEERING_PHILOSOPHY</text>
      <text x="18" y="54" class="sans quote-text">"Architecture first. Build for failure,</text>
      <text x="18" y="74" class="sans quote-text">design for scale, and execute with absolute</text>
      <text x="18" y="94" class="sans quote-text">precision. Aesthetics + rock-solid logic."</text>
    </g>

    <!-- Card 2: Mission -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="350" height="110" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <!-- Left Glowing Border -->
      <rect x="0" y="0" width="4" height="110" rx="2" fill="#4F94EF" filter="url(#neon-glow)" />

      <text x="18" y="28" class="mono card-title" fill="#4F94EF">🎯 // CORE_MISSION</text>
      <text x="18" y="54" class="sans quote-text">"Transforming complex product ideas into</text>
      <text x="18" y="74" class="sans quote-text">resilient, low-latency, and bulletproof</text>
      <text x="18" y="94" class="sans quote-text">digital infrastructure."</text>
    </g>

    <!-- Card 3: Cyber Skill Badges -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="350" height="70" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="15" y="24" class="mono label-text" font-size="11">&gt; DOMAIN_SPECIALIZATIONS</text>

      <!-- Pill Badges -->
      <rect x="15" y="36" width="95" height="22" class="tag-bg" />
      <text x="62" y="51" text-anchor="middle" class="mono tag-text">DISTRIBUTED</text>

      <rect x="118" y="36" width="75" height="22" class="tag-bg" />
      <text x="155" y="51" text-anchor="middle" class="mono tag-text" fill="#4F94EF">FINTECH</text>

      <rect x="201" y="36" width="70" height="22" class="tag-bg" />
      <text x="236" y="51" text-anchor="middle" class="mono tag-text" fill="#00FFA3">FLUTTER</text>

      <rect x="279" y="36" width="58" height="22" class="tag-bg" />
      <text x="308" y="51" text-anchor="middle" class="mono tag-text" fill="#FFB800">SPRING</text>
    </g>

  </g>

</svg>
