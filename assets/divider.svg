<svg width="100%" height="20" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="8" width="1000" height="2" fill="url(#grad1)" filter="url(#glow)" />
  <circle cx="500" cy="9" r="4" fill="#00FFA3" filter="url(#glow)" />
</svg>
