<svg width="250" height="300" viewBox="0 0 250 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g transform="rotate(-3) translate(5, 10)" filter="url(#shadow)">
    <!-- Polaroid Frame -->
    <rect x="0" y="0" width="230" height="270" rx="4" fill="#F4F4F0" stroke="#E2E2DC" stroke-width="1" />
    <!-- Photo Area -->
    <rect x="15" y="15" width="200" height="200" rx="2" fill="#121212" />

    <!-- Hacker Silhouette / Logo placeholder -->
    <circle cx="115" cy="90" r="40" fill="#2B2B2B" stroke="#FFE600" stroke-width="2" />
    <path d="M 55 190 C 55 140 175 140 175 190 Z" fill="#2B2B2B" stroke="#FFE600" stroke-width="2" />
    <rect x="90" y="82" width="50" height="12" rx="3" fill="#FFE600" opacity="0.9" />

    <!-- Rubber Stamp -->
    <g transform="translate(-10, 20) rotate(-15)">
      <circle cx="35" cy="35" r="35" fill="none" stroke="#121212" stroke-width="2" stroke-dasharray="5 3" />
      <circle cx="35" cy="35" r="30" fill="none" stroke="#121212" stroke-width="1" />
      <path d="M 12 35 L 58 35" stroke="#121212" stroke-width="1" />
      <text x="35" y="32" text-anchor="middle" font-family="Impact, sans-serif" font-size="9" fill="#121212">SOFTWARE</text>
      <text x="35" y="44" text-anchor="middle" font-family="Impact, sans-serif" font-size="9" fill="#121212">ENGINEER</text>
    </g>

    <!-- Barcode -->
    <g transform="translate(40, 225)">
      <!-- Random barcode lines -->
      <path d="M0 0 v25 m4 -25 v25 m3 -25 v25 m2 -25 v25 m5 -25 v25 m1 -25 v25 m3 -25 v25 m6 -25 v25 m2 -25 v25 m4 -25 v25 m1 -25 v25 m5 -25 v25 m2 -25 v25 m4 -25 v25 m2 -25 v25 m5 -25 v25 m1 -25 v25 m4 -25 v25 m3 -25 v25 m6 -25 v25 m2 -25 v25 m4 -25 v25 m1 -25 v25 m5 -25 v25 m2 -25 v25 m4 -25 v25 m3 -25 v25 m6 -25 v25 m2 -25 v25 m4 -25 v25 m1 -25 v25 m5 -25 v25" stroke="#121212" stroke-width="1.5" />
      <text x="75" y="35" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="8" fill="#121212">PRABHAV-BATRA-SYS</text>
    </g>

    <!-- Paperclip -->
    <path d="M 175 -10 C 180 -10 185 -5 185 5 L 185 35 C 185 45 175 45 175 35 L 175 5 C 175 0 179 0 179 5 L 179 30" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
