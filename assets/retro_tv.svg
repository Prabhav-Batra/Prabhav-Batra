<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-3" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Arrow pointing to TV -->
  <g transform="translate(10, 85)">
    <path d="M 0 0 Q 15 25 35 -5" fill="none" stroke="#121212" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" />
    <path d="M 28 -8 L 36 -6 L 31 2" fill="none" stroke="#121212" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Retro TV Widget -->
  <g transform="translate(45, 15)" filter="url(#shadow)">
    <!-- TV Outer Shell -->
    <rect x="0" y="0" width="150" height="100" rx="10" fill="#24272D" stroke="#121212" stroke-width="2" />
    <!-- TV Screen Inner Frame -->
    <rect x="8" y="10" width="105" height="80" rx="6" fill="#0F1217" stroke="#3A3F4B" stroke-width="2" />

    <!-- Screen Text -->
    <text x="60" y="45" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">Available</text>
    <text x="60" y="70" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="20" fill="#FFE600" filter="url(#glow)">NOW</text>

    <!-- TV Controls Right Side -->
    <circle cx="132" cy="25" r="5" fill="#121212" />
    <circle cx="132" cy="45" r="5" fill="#121212" />
    <rect x="126" y="62" width="12" height="18" rx="2" fill="#121212" />
    <!-- Speaker Grille Lines -->
    <line x1="128" y1="66" x2="136" y2="66" stroke="#555" stroke-width="1.5" />
    <line x1="128" y1="71" x2="136" y2="71" stroke="#555" stroke-width="1.5" />
    <line x1="128" y1="76" x2="136" y2="76" stroke="#555" stroke-width="1.5" />
  </g>
</svg>
