<svg width="100%" height="4" viewBox="0 0 1200 4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0" />
      <stop offset="15%" stop-color="#00D4FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4F94EF" stop-opacity="1" />
      <stop offset="85%" stop-color="#00D4FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-500%" width="120%" height="1000%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="2" y="1" fill="url(#cyan-gradient)" filter="url(#glow)"/>
</svg>
