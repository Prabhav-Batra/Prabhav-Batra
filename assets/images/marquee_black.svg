<svg width="100%" height="60" viewBox="0 0 2000 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background with a slight upward tilt -->
  <g transform="rotate(2 1000 30)">
    <!-- Black strip extending beyond bounds -->
    <rect x="-100" y="5" width="2200" height="50" fill="#000000" />
    <!-- White borders top and bottom -->
    <line x1="-100" y1="5" x2="2100" y2="5" stroke="#FFFFFF" stroke-width="3" />
    <line x1="-100" y1="55" x2="2100" y2="55" stroke="#FFFFFF" stroke-width="3" />
    
    <!-- Scrolling text -->
    <text x="0" y="42" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="4">
      HIGH THROUGHPUT // SCALABLE ARCHITECTURE // HIGH THROUGHPUT // SCALABLE ARCHITECTURE // HIGH THROUGHPUT // SCALABLE ARCHITECTURE // HIGH THROUGHPUT // SCALABLE ARCHITECTURE // HIGH THROUGHPUT // SCALABLE ARCHITECTURE
      <!-- Animation translating right -->
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="20s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
