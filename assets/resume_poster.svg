<svg width="100%" height="100%" viewBox="0 0 900 1250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Textured Background Gradient -->
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Center Paper Sheet Gradient -->
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F6F2" />
      <stop offset="100%" stop-color="#EFEFEA" />
    </linearGradient>

    <!-- Yellow Accent Gradient -->
    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#F5C400" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="polaroid-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,800&amp;family=Syne:wght@700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');

    .serif-title { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 800; fill: #FFFFFF; }
    .serif-script { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; fill: #121212; }
    .syne-head { font-family: 'Syne', -apple-system, sans-serif; font-weight: 900; fill: #121212; letter-spacing: -1.5px; }
    .syne-sec { font-family: 'Syne', -apple-system, sans-serif; font-weight: 800; fill: #121212; letter-spacing: -0.5px; }
    .sans-body { font-family: 'Inter', -apple-system, sans-serif; fill: #2B2B2B; line-height: 1.5; }
    .sans-sub { font-family: 'Inter', -apple-system, sans-serif; fill: #666666; font-weight: 500; }
    .mono-code { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; }
  </style>

  <!-- BACKGROUND (Dark Grunge Theme) -->
  <rect width="900" height="1250" fill="url(#dark-bg)" />

  <!-- Top Title: Résumé -->
  <text x="450" y="75" text-anchor="middle" class="serif-title" font-size="64">Résumé</text>
  <!-- Curved Arrow Doodle -->
  <path d="M 570 70 Q 610 85 640 65" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" />
  <path d="M 632 58 L 642 65 L 636 75" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- MAIN CENTER PAPER SHEET CONTAINER -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="820" height="1090" rx="16" fill="url(#paper-bg)" />
  </g>

  <!-- ================= HEADER SECTION ================= -->
  <!-- Polaroid Photo Frame (Left Column) -->
  <g transform="translate(75, 140) rotate(-4)" filter="url(#polaroid-shadow)">
    <!-- White Polaroid Base -->
    <rect x="0" y="0" width="250" height="300" rx="4" fill="#FFFFFF" stroke="#E2E2DC" stroke-width="1" />

    <!-- Photo Area (Dark Cyber / Photo Graphic) -->
    <rect x="16" y="16" width="218" height="218" rx="2" fill="#1A1D24" />

    <!-- Avatar Placeholder Graphic (Futuristic Developer Portrait Styling) -->
    <circle cx="125" cy="100" r="45" fill="#2A303C" stroke="#00D4FF" stroke-width="2" />
    <path d="M 65 200 C 65 155 185 155 185 200 Z" fill="#2A303C" stroke="#00D4FF" stroke-width="2" />
    <!-- Cyber Glasses Effect -->
    <rect x="95" y="92" width="60" height="16" rx="4" fill="#00D4FF" opacity="0.85" />

    <!-- Circular Rubber Stamp Badge (Top Left of Polaroid) -->
    <g transform="translate(-15, 30) rotate(-15)">
      <circle cx="35" cy="35" r="38" fill="none" stroke="#121212" stroke-width="2.5" stroke-dasharray="6 3" />
      <circle cx="35" cy="35" r="32" fill="none" stroke="#121212" stroke-width="1" />
      <path d="M 12 35 L 58 35" stroke="#121212" stroke-width="1.5" />
      <text x="35" y="31" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="900" font-size="8" fill="#121212">SOFTWARE</text>
      <text x="35" y="43" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="900" font-size="8" fill="#121212">ENGINEER</text>
    </g>

    <!-- Star Burst Sticker (Bottom Right of Photo Area) -->
    <g transform="translate(200, 205)">
      <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4" fill="#121212" />
    </g>

    <!-- Barcode at Bottom of Polaroid -->
    <g transform="translate(45, 246)">
      <rect x="0" y="0" width="3" height="32" fill="#121212" />
      <rect x="5" y="0" width="1" height="32" fill="#121212" />
      <rect x="8" y="0" width="4" height="32" fill="#121212" />
      <rect x="15" y="0" width="2" height="32" fill="#121212" />
      <rect x="20" y="0" width="5" height="32" fill="#121212" />
      <rect x="28" y="0" width="1" height="32" fill="#121212" />
      <rect x="32" y="0" width="3" height="32" fill="#121212" />
      <rect x="38" y="0" width="6" height="32" fill="#121212" />
      <rect x="47" y="0" width="2" height="32" fill="#121212" />
      <rect x="52" y="0" width="4" height="32" fill="#121212" />
      <rect x="59" y="0" width="1" height="32" fill="#121212" />
      <rect x="63" y="0" width="5" height="32" fill="#121212" />
      <rect x="71" y="0" width="2" height="32" fill="#121212" />
      <rect x="76" y="0" width="4" height="32" fill="#121212" />
      <rect x="83" y="0" width="2" height="32" fill="#121212" />
      <rect x="88" y="0" width="5" height="32" fill="#121212" />
      <rect x="96" y="0" width="1" height="32" fill="#121212" />
      <rect x="100" y="0" width="4" height="32" fill="#121212" />
      <rect x="107" y="0" width="3" height="32" fill="#121212" />
      <rect x="113" y="0" width="6" height="32" fill="#121212" />
      <rect x="122" y="0" width="2" height="32" fill="#121212" />
      <rect x="127" y="0" width="4" height="32" fill="#121212" />
      <rect x="134" y="0" width="1" height="32" fill="#121212" />
      <rect x="138" y="0" width="5" height="32" fill="#121212" />
      <rect x="146" y="0" width="2" height="32" fill="#121212" />
      <rect x="151" y="0" width="4" height="32" fill="#121212" />
      <text x="78" y="42" text-anchor="middle" font-family="monospace" font-size="8" fill="#121212">PRABHAV-BATRA-DEV</text>
    </g>

    <!-- Paperclip on Top Right -->
    <g transform="translate(195, -15)">
      <path d="M 10 0 C 15 0 20 5 20 15 L 20 45 C 20 55 10 55 10 45 L 10 15 C 10 10 14 10 14 15 L 14 40" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- About Me Header & Name (Right Column) -->
  <g transform="translate(365, 155)">
    <!-- Header tag line -->
    <text x="0" y="0" class="syne-sec" font-size="16" fill="#121212">About Me <tspan font-family="'Playfair Display', serif" font-style="italic" font-weight="400" font-size="14" fill="#666666">My name is</tspan></text>

    <!-- Doodles next to About Me -->
    <g transform="translate(230, -22) scale(0.7)">
      <!-- Hand sign sketches -->
      <path d="M0,20 Q5,0 10,20 M12,20 Q17,2 22,20 M24,20 Q29,5 34,20 M36,20 Q40,10 44,25" fill="none" stroke="#121212" stroke-width="1.5" />
    </g>

    <!-- BIG BOLD NAME WITH OVERLAY SCRIPT -->
    <g transform="translate(0, 45)">
      <!-- Giant Heavy Sans Name -->
      <text x="0" y="25" class="syne-head" font-size="46">Prabhav</text>
      <text x="0" y="68" class="syne-head" font-size="46">Batra</text>
      <!-- Script Accent Overlay -->
      <text x="15" y="48" class="serif-script" font-size="44" fill="#121212" opacity="0.9">Software Architect</text>
    </g>

    <!-- Bio Text Paragraph -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" class="sans-body" font-size="13.5" font-weight="500">I am a passionate Systems &amp; Full-Stack Engineer specializing in</text>
      <text x="0" y="20" class="sans-body" font-size="13.5" font-weight="500">building high-throughput backend infrastructure, cross-platform</text>
      <text x="0" y="40" class="sans-body" font-size="13.5" font-weight="500">Flutter applications, and resilient distributed microservices.</text>
      <text x="0" y="60" class="sans-body" font-size="13.5" font-weight="500">Focused on clean architecture, performance, and impact.</text>
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="75" y1="460" x2="825" y2="460" stroke="#D5D5CF" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- ================= MIDDLE SECTION ================= -->
  <!-- LEFT COLUMN: EXPERIENCE & FEATURED PROJECTS (x: 75 to 440) -->
  <g transform="translate(75, 490)">
    <text x="0" y="0" class="syne-head" font-size="28">Experience</text>
    <text x="175" y="-2" class="serif-script" font-size="18" fill="#777777">2022 - 2026</text>

    <!-- Dotted Timeline List -->
    <g transform="translate(10, 25)">
      <!-- Vertical Dotted Line -->
      <line x1="0" y1="10" x2="0" y2="280" stroke="#777777" stroke-width="2" stroke-dasharray="4 4" />

      <!-- Item 1: ProjectOS -->
      <g transform="translate(0, 10)">
        <circle cx="0" cy="6" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" filter="url(#badge-glow)" />
        <text x="18" y="10" class="syne-sec" font-size="15">ProjectOS Lead Architect <tspan class="sans-sub" font-size="12">(2025 - Present)</tspan></text>
        <text x="18" y="28" class="sans-sub" font-size="12">AI-powered engineering OS automating workflow orchestration.</text>
      </g>

      <!-- Item 2: FluxPay Backend -->
      <g transform="translate(0, 75)">
        <circle cx="0" cy="6" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" filter="url(#badge-glow)" />
        <text x="18" y="10" class="syne-sec" font-size="15">FluxPay Payment Systems <tspan class="sans-sub" font-size="12">(2024 - 2025)</tspan></text>
        <text x="18" y="28" class="sans-sub" font-size="12">High-throughput Spring Boot double-entry ledger gateway.</text>
      </g>

      <!-- Item 3: FluxPay Mobile -->
      <g transform="translate(0, 140)">
        <circle cx="0" cy="6" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" filter="url(#badge-glow)" />
        <text x="18" y="10" class="syne-sec" font-size="15">FluxPay Mobile Apps <tspan class="sans-sub" font-size="12">(2024 - 2025)</tspan></text>
        <text x="18" y="28" class="sans-sub" font-size="12">Cross-platform Flutter fintech application with biometric auth.</text>
      </g>

      <!-- Item 4: NIDS Security CLI -->
      <g transform="translate(0, 205)">
        <circle cx="0" cy="6" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" filter="url(#badge-glow)" />
        <text x="18" y="10" class="syne-sec" font-size="15">NIDS Security CLI <tspan class="sans-sub" font-size="12">(2023 - 2024)</tspan></text>
        <text x="18" y="28" class="sans-sub" font-size="12">Real-time packet inspection and ML network intrusion detection.</text>
      </g>
    </g>

    <!-- Key Engineering Milestones Sub-Section -->
    <g transform="translate(0, 350)">
      <text x="0" y="0" class="syne-head" font-size="26">Milestones</text>

      <g transform="translate(10, 25)">
        <line x1="0" y1="10" x2="0" y2="90" stroke="#777777" stroke-width="2" stroke-dasharray="4 4" />

        <g transform="translate(0, 10)">
          <circle cx="0" cy="6" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
          <text x="18" y="10" class="syne-sec" font-size="14">Open Source Contributor &amp; System Designer</text>
          <text x="18" y="26" class="sans-sub" font-size="12">Engineered scalable microservices &amp; developer tools.</text>
        </g>

        <g transform="translate(0, 60)">
          <circle cx="0" cy="6" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
          <text x="18" y="10" class="syne-sec" font-size="14">Production-Grade Release Benchmark</text>
          <text x="18" y="26" class="sans-sub" font-size="12">Achieved 99.9% uptime target across deployed apps.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: EDUCATION, SKILLS & CONNECT (x: 480 to 825) -->
  <g transform="translate(480, 490)">
    <!-- Education Section -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="syne-head" font-size="28">Education</text>

      <g transform="translate(0, 25)">
        <circle cx="6" cy="10" r="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
        <text x="24" y="12" class="syne-sec" font-size="15">Bachelor of Technology in CS / Software</text>
        <text x="24" y="30" class="sans-sub" font-size="12">Focus on Data Structures, Distributed Systems &amp; AI</text>
      </g>
    </g>

    <!-- Skills Section -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" class="syne-head" font-size="28">Skills <tspan class="serif-script" font-size="16" fill="#777777">Tech Stack</tspan></text>

      <!-- Grid of Tech Stack Icon Tiles -->
      <g transform="translate(0, 20)">
        <!-- Row 1 -->
        <!-- Java -->
        <g transform="translate(0, 0)">
          <rect width="52" height="52" rx="10" fill="#0D1117" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">Java</text>
        </g>
        <!-- Spring -->
        <g transform="translate(60, 0)">
          <rect width="52" height="52" rx="10" fill="#6DB33F" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Spring</text>
        </g>
        <!-- Flutter -->
        <g transform="translate(120, 0)">
          <rect width="52" height="52" rx="10" fill="#02569B" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Flutter</text>
        </g>
        <!-- Dart -->
        <g transform="translate(180, 0)">
          <rect width="52" height="52" rx="10" fill="#0175C2" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">Dart</text>
        </g>

        <!-- Row 2 -->
        <!-- React -->
        <g transform="translate(0, 60)">
          <rect width="52" height="52" rx="10" fill="#20232A" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="13" fill="#61DAFB">React</text>
        </g>
        <!-- Postgres -->
        <g transform="translate(60, 60)">
          <rect width="52" height="52" rx="10" fill="#336791" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">Postgres</text>
        </g>
        <!-- Redis -->
        <g transform="translate(120, 60)">
          <rect width="52" height="52" rx="10" fill="#DC382D" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">Redis</text>
        </g>
        <!-- Docker -->
        <g transform="translate(180, 60)">
          <rect width="52" height="52" rx="10" fill="#2496ED" />
          <text x="26" y="32" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Docker</text>
        </g>
      </g>
    </g>

    <!-- Connect / Links Section -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" class="syne-head" font-size="28">Portfolio <tspan class="serif-script" font-size="16" fill="#777777">Clickable Links</tspan></text>

      <!-- Yellow Button Links -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="110" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
        <text x="55" y="23" text-anchor="middle" class="syne-sec" font-size="14">GitHub</text>

        <rect x="122" y="0" width="110" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
        <text x="177" y="23" text-anchor="middle" class="syne-sec" font-size="14">LinkedIn</text>

        <rect x="0" y="46" width="110" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="2" />
        <text x="55" y="69" text-anchor="middle" class="syne-sec" font-size="14">Projects</text>

        <rect x="122" y="46" width="110" height="36" rx="6" fill="#121212" stroke="#121212" stroke-width="2" />
        <text x="177" y="69" text-anchor="middle" class="syne-sec" font-size="14" fill="#FFFFFF">Email</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM DECORATIVE WIDGET ================= -->
  <!-- Retro TV Widget ("Available Now") at Bottom Right -->
  <g transform="translate(620, 945)" filter="url(#shadow)">
    <!-- TV Outer Shell -->
    <rect x="0" y="0" width="205" height="125" rx="14" fill="#24272D" stroke="#121212" stroke-width="3" />
    <!-- TV Screen Inner Frame -->
    <rect x="12" y="12" width="145" height="100" rx="10" fill="#0F1217" stroke="#3A3F4B" stroke-width="2" />

    <!-- Screen Text -->
    <text x="85" y="55" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="900" font-size="17" fill="#FFFFFF">Available</text>
    <text x="85" y="80" text-anchor="middle" font-family="'Syne', sans-serif" font-weight="900" font-size="24" fill="#FFE600" filter="url(#badge-glow)">NOW</text>

    <!-- TV Controls Right Side -->
    <circle cx="178" cy="30" r="8" fill="#121212" />
    <circle cx="178" cy="55" r="8" fill="#121212" />
    <rect x="170" y="75" width="16" height="24" rx="3" fill="#121212" />
    <!-- Speaker Grille Lines -->
    <line x1="173" y1="80" x2="183" y2="80" stroke="#555" stroke-width="1.5" />
    <line x1="173" y1="87" x2="183" y2="87" stroke="#555" stroke-width="1.5" />
    <line x1="173" y1="94" x2="183" y2="94" stroke="#555" stroke-width="1.5" />
  </g>

  <!-- Arrow Doodle Pointing to TV Widget -->
  <g transform="translate(540, 1020)">
    <path d="M 0 0 Q 30 40 60 10" fill="none" stroke="#121212" stroke-width="2.5" stroke-dasharray="5 3" stroke-linecap="round" />
    <path d="M 50 5 L 62 10 L 56 22" fill="none" stroke="#121212" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Cassette Tape Decorative Graphic on Middle Right -->
  <g transform="translate(680, 420) rotate(8)">
    <rect x="0" y="0" width="130" height="80" rx="6" fill="#333333" stroke="#121212" stroke-width="2" />
    <rect x="10" y="10" width="110" height="60" rx="4" fill="#EAEAEA" />
    <rect x="25" y="25" width="80" height="30" rx="3" fill="#222222" />
    <circle cx="45" cy="40" r="10" fill="#FFFFFF" />
    <circle cx="85" cy="40" r="10" fill="#FFFFFF" />
    <text x="65" y="20" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#121212">STEREO TAPE</text>
  </g>

</svg>
