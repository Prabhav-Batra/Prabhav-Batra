<svg width="100%" height="60" viewBox="0 0 2000 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Red background with a slight tilt -->
  <g transform="rotate(-1.5 1000 30)">
    <!-- Red strip extending beyond bounds to cover rotation gaps -->
    <rect x="-100" y="5" width="2200" height="50" fill="#FF1001" />
    
    <!-- Scrolling text -->
    <text x="0" y="42" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="28" fill="#000000" letter-spacing="4">
      NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE // NO FLUFF // RAW CODE
      <!-- Animation translating left -->
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="15s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
